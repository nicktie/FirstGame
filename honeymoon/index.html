<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>رسالة لك 💌</title>
<meta name="theme-color" content="#F6E4EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4A2545; --ink-soft:rgba(74,37,69,.66);
    --gold:#D68FB0; --gold-soft:#F0C9DE;
    --ivory:#FDF4F8; --ivory-2:#F6E4EE;
    --wine:#9C3F72; --sage:#B79FDB;
    --line:rgba(74,37,69,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Tajawal',sans-serif; color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% 0%, #FBE6F1 0%, #F3DCEC 40%, #EBD7F0 100%);
    display:flex; align-items:center; justify-content:center;
    padding:22px; overflow:hidden; position:relative;
  }

  /* floating hearts */
  .hearts{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0}
  .hearts span{
    position:absolute; bottom:-40px; font-size:16px; opacity:0;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(.7) rotate(0deg); opacity:0}
    12%{opacity:.75}
    100%{transform:translateY(-108vh) scale(1.05) rotate(22deg); opacity:0}
  }
  @media (prefers-reduced-motion:reduce){ .hearts{display:none} }

  /* card */
  .card{
    position:relative; z-index:1; width:100%; max-width:380px;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:28px; padding:34px 26px 28px;
    text-align:center;
    box-shadow:0 24px 60px rgba(74,37,69,.16), 0 2px 0 rgba(255,255,255,.9) inset;
    animation:pop .6s cubic-bezier(.34,1.4,.64,1);
  }
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}

  /* envelope */
  .env{
    width:96px; height:70px; margin:0 auto 20px; position:relative;
    filter:drop-shadow(0 10px 18px rgba(156,63,114,.22));
  }
  .env .body{
    position:absolute; inset:0; border-radius:10px;
    background:linear-gradient(160deg,#FFF6FA,#F7DCEA);
    border:1.5px solid var(--gold-soft);
  }
  .env .flap{
    position:absolute; left:0; right:0; top:0; height:44px;
    background:linear-gradient(160deg,#F9E3EE,#EFC9DC);
    border:1.5px solid var(--gold-soft);
    border-radius:10px 10px 46% 46%;
    transform-origin:top center; transition:transform .7s cubic-bezier(.5,-0.2,.3,1.3);
  }
  .env .seal{
    position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    width:30px; height:30px; border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #E9A4C2, var(--wine));
    color:#fff; font-size:14px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 8px rgba(156,63,114,.4); z-index:2;
    transition:transform .5s ease, opacity .5s ease;
  }
  body.opened .env .flap{transform:rotateX(-172deg)}
  body.opened .env .seal{transform:translate(-50%,-50%) scale(.2) rotate(160deg); opacity:0}

  h1{font-family:'Amiri',serif; font-size:25px; font-weight:700; margin-bottom:7px; line-height:1.35}
  h1 em{font-style:normal; color:var(--wine)}
  .sub{font-size:13.5px; color:var(--ink-soft); line-height:1.85; margin-bottom:22px}

  /* pin */
  .pin{display:flex; gap:10px; justify-content:center; direction:ltr; margin-bottom:8px}
  .pin input{
    width:54px; height:62px; text-align:center;
    font-family:'Amiri',serif; font-size:26px; font-weight:700; color:var(--wine);
    background:#fff; border:1.6px solid var(--gold-soft); border-radius:16px;
    outline:none; transition:.2s; box-shadow:0 3px 10px rgba(74,37,69,.06);
    -moz-appearance:textfield;
  }
  .pin input::-webkit-outer-spin-button,.pin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .pin input:focus{
    border-color:var(--gold); transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(214,143,176,.34), 0 0 0 4px rgba(240,201,222,.5);
  }
  .pin input.filled{background:#FFF8FC; border-color:var(--gold)}
  body.wrong .pin{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
    40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
  }
  body.wrong .pin input{border-color:#E2799C}

  .msg{min-height:22px; font-size:12.5px; color:var(--ink-soft); margin:6px 0 16px; transition:.2s}
  .msg.err{color:#C2456F; font-weight:700}
  .msg.ok{color:#3E9E7A; font-weight:700}

  button.go{
    width:100%; padding:14px; border:none; border-radius:16px; cursor:pointer;
    font-family:'Tajawal',sans-serif; font-size:15.5px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,#E39CBC,var(--wine));
    box-shadow:0 10px 24px rgba(156,63,114,.3);
    transition:transform .15s, box-shadow .2s, opacity .2s;
  }
  button.go:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(156,63,114,.36)}
  button.go:active{transform:translateY(0)}
  button.go:disabled{opacity:.6; cursor:default; transform:none}

  .foot{margin-top:16px; font-family:'Aref Ruqaa',serif; font-size:15px; color:var(--gold)}

  /* ---- memory game ---- */
  .playlink{
    display:block; width:100%; margin-top:14px; background:none; border:none; cursor:pointer;
    font-family:'Tajawal',sans-serif; font-size:12.5px; font-weight:700; color:var(--wine);
    opacity:.85; text-decoration:underline; text-underline-offset:4px;
    text-decoration-color:var(--gold-soft); padding:6px;
  }
  .playlink[hidden]{display:none}   /* explicit display would otherwise beat [hidden] */
  .playlink:hover{opacity:1}
  .game[hidden]{display:none}
  .game{margin-top:6px; animation:pop .45s cubic-bezier(.34,1.4,.64,1)}
  .g-bar{height:5px; border-radius:999px; background:var(--ivory-2); overflow:hidden; margin-bottom:10px}
  .g-bar i{display:block; height:100%; width:0; border-radius:999px;
    background:linear-gradient(90deg,#E39CBC,var(--wine)); transition:width .45s cubic-bezier(.34,1.2,.64,1)}
  .g-step{font-size:11.5px; color:var(--ink-soft); letter-spacing:.12em; margin-bottom:10px}
  .g-q{font-family:'Amiri',serif; font-size:19px; font-weight:700; line-height:1.5; margin-bottom:14px}
  .g-opts{display:flex; flex-direction:column; gap:8px}
  .g-opt{
    width:100%; padding:12px 14px; border-radius:14px; cursor:pointer;
    font-family:'Tajawal',sans-serif; font-size:13.5px; font-weight:700; color:var(--ink);
    background:#fff; border:1.6px solid var(--gold-soft); transition:.18s; text-align:center;
  }
  .g-opt:hover{border-color:var(--gold); transform:translateY(-1px)}
  .g-opt.right{background:#EAF8F1; border-color:#3E9E7A; color:#2C7A5C}
  .g-opt.wrong{background:#FDECF2; border-color:#E2799C; color:#C2456F; animation:shake .4s}
  .g-opt:disabled{cursor:default; transform:none}
  .g-love{font-size:13.5px; line-height:1.9; color:var(--ink); margin:2px 0 12px}
  .g-hint{
    display:flex; gap:9px; align-items:flex-start; text-align:right;
    background:linear-gradient(135deg,#FFF6E6,#FDEBF3);
    border:1.5px dashed var(--gold); border-radius:16px; padding:12px 14px;
    font-size:13px; font-weight:700; color:#8A5B2E; margin-bottom:14px;
  }
  .g-bulb{flex:0 0 auto; font-size:16px}
  .g-done-h{font-family:'Amiri',serif; font-size:20px; font-weight:700; color:var(--wine); margin-bottom:12px}
  .g-hints{list-style:none; text-align:right; margin-bottom:14px}
  .g-hints li{
    font-size:12.5px; color:var(--ink-soft); line-height:1.8; padding:7px 12px; margin-bottom:6px;
    background:var(--ivory); border-radius:12px; border-right:3px solid var(--gold-soft);
  }
  .g-hints li.last{color:var(--wine); font-weight:700; border-right-color:var(--wine); background:#FFF3F9}

  /* ---- slide to open ---- */
  .slide[hidden]{display:none}
  .slide{margin-top:4px;animation:slideIn .45s cubic-bezier(.34,1.4,.64,1)}
  @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .slide-track{
    --p:0;                                   /* 0 -> 1 as she drags */
    position:relative; height:60px; border-radius:30px; overflow:hidden;
    background:linear-gradient(90deg,
      color-mix(in srgb,#E39CBC calc(var(--p)*100%),#F7E4EE) 0%,
      #F7E4EE 100%);
    border:1.5px solid var(--gold-soft);
    box-shadow:inset 0 2px 6px rgba(156,63,114,.10);
    display:flex; align-items:center; justify-content:center;
    touch-action:none; user-select:none;
  }
  .slide-hint{
    font-size:13.5px; font-weight:700; color:var(--wine); pointer-events:none;
    opacity:calc(1 - var(--p) * 1.6);
    background:linear-gradient(90deg,rgba(156,63,114,.45),var(--wine),rgba(156,63,114,.45));
    background-size:220% 100%;
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    animation:shine 2.4s linear infinite;
  }
  @keyframes shine{from{background-position:220% 0}to{background-position:-20% 0}}
  .slide-knob{
    position:absolute; top:4px; right:4px; width:52px; height:52px; border-radius:50%;
    border:none; cursor:grab; font-size:22px; line-height:1;
    background:radial-gradient(circle at 34% 30%,#F4B9D2,var(--wine));
    color:#fff; box-shadow:0 6px 16px rgba(156,63,114,.42);
    display:flex; align-items:center; justify-content:center;
    touch-action:none; transition:box-shadow .2s;
  }
  .slide-knob:active,.slide-knob.grab{cursor:grabbing; box-shadow:0 8px 22px rgba(156,63,114,.6)}
  .slide-knob:focus-visible{outline:3px solid var(--wine); outline-offset:3px}
  .slide.done .slide-hint{opacity:0}
  @media (prefers-reduced-motion:reduce){ .slide-hint{animation:none} }

  /* loading */
  .spin{
    display:none; width:18px; height:18px; margin:0 auto;
    border:2.5px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  body.loading .spin{display:block}
  body.loading .go-text{display:none}

  /* success burst */
  .burst{position:fixed; inset:0; pointer-events:none; z-index:5; display:none}
  body.opened .burst{display:block}
  .burst i{
    position:absolute; left:50%; top:50%; font-size:20px; font-style:normal;
    animation:burst .9s ease-out forwards;
  }
  @keyframes burst{
    from{transform:translate(-50%,-50%) scale(.4); opacity:1}
    to{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity:0}
  }
  @media(max-width:360px){ .pin input{width:48px;height:56px;font-size:23px} }
</style>
</head>
<body>

<div class="hearts" id="hearts" aria-hidden="true"></div>
<div class="burst" id="burst" aria-hidden="true"></div>

<main class="card">
  <div class="env" aria-hidden="true">
    <div class="body"></div>
    <div class="flap"></div>
    <div class="seal">♥</div>
  </div>

  <h1>رسالة <em>لك</em> وحدك 💌</h1>
  <p class="sub">في الداخل رحلتنا الأولى معا…<br>اكتبي الرمز السري لتفتحيها</p>

  <form id="form" autocomplete="off">
    <div class="pin" id="pin">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم الأول">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم الثاني">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم الثالث">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم الرابع">
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <button class="go" id="go" type="submit">
      <span class="go-text">افتحي الرسالة 💖</span>
      <span class="spin"></span>
    </button>
  </form>

  <!-- shown once the code is right: drag the seal across to open the letter -->
  <div class="slide" id="slide" hidden>
    <div class="slide-track" id="slideTrack">
      <span class="slide-hint">اسحبي لفتح الرسالة</span>
      <button class="slide-knob" id="slideKnob" type="button"
              aria-label="اسحبي لفتح الرسالة" role="slider"
              aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">💌</button>
    </div>
  </div>

  <button class="playlink" id="playLink" type="button">🎀 ما تذكرين الرمز؟ العبي معي</button>

  <!-- little memory game: each right answer gives a hint about the code -->
  <div class="game" id="game" hidden>
    <div class="g-bar"><i id="gBar"></i></div>
    <div class="g-step" id="gStep"></div>

    <div id="gAsk">
      <div class="g-q" id="gQ"></div>
      <div class="g-opts" id="gOpts"></div>
    </div>

    <div id="gFeed" hidden>
      <div class="g-love" id="gLove"></div>
      <div class="g-hint"><span class="g-bulb">💡</span><span id="gHint"></span></div>
      <button class="go" id="gNext" type="button">التالي ←</button>
    </div>

    <div id="gDone" hidden>
      <div class="g-done-h">كل التلميحات معك الحين 💕</div>
      <ul class="g-hints" id="gHints"></ul>
      <button class="go" id="gGo" type="button">أدخلي الرمز 💌</button>
    </div>

    <button class="playlink" id="gClose" type="button">↩ رجوع للرمز</button>
  </div>

  <div class="foot">أسامة ♥ سُهى</div>
</main>

<script>
'use strict';
const ITER = 300000, ENC_URL = 'journey.enc', KEEP = 'hm_open';

const $ = id => document.getElementById(id);
const ar = n => String(n).replace(/[0-9]/g, d => '\u0660\u0661\u0662\u0663\u0664\u0665\u0666\u0667\u0668\u0669'[d]);
const pin = [...$('pin').querySelectorAll('input')];
const msg = $('msg'), go = $('go'), form = $('form');

/* ---- floating hearts ---- */
(function(){
  const wrap = $('hearts'), glyphs = ['💗','💖','🤍','💕','🌸','✨'];
  for (let i = 0; i < 16; i++){
    const s = document.createElement('span');
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = Math.random()*100 + '%';
    s.style.fontSize = (12 + Math.random()*14) + 'px';
    s.style.animationDuration = (9 + Math.random()*9) + 's';
    s.style.animationDelay = (Math.random()*10) + 's';
    wrap.appendChild(s);
  }
})();

/* ---- pin box behaviour: auto-advance, backspace, paste ---- */
pin.forEach((box, i) => {
  box.addEventListener('input', () => {
    box.value = box.value.replace(/\D/g,'').slice(0,1);
    box.classList.toggle('filled', !!box.value);
    clearError();
    if (box.value && i < pin.length-1) pin[i+1].focus();
    if (pin.every(b => b.value)) form.requestSubmit();
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !box.value && i > 0){ pin[i-1].focus(); pin[i-1].value=''; pin[i-1].classList.remove('filled'); }
    if (e.key === 'ArrowLeft'  && i > 0) pin[i-1].focus();
    if (e.key === 'ArrowRight' && i < pin.length-1) pin[i+1].focus();
  });
  box.addEventListener('paste', e => {
    const d = (e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);
    if (!d) return;
    e.preventDefault();
    d.split('').forEach((ch,k) => { if (pin[k]){ pin[k].value=ch; pin[k].classList.add('filled'); } });
    (pin[d.length] || pin[3]).focus();
    if (pin.every(b => b.value)) form.requestSubmit();
  });
});
setTimeout(() => pin[0].focus(), 400);

function clearError(){ document.body.classList.remove('wrong'); if (msg.classList.contains('err')){ msg.textContent=''; msg.className='msg'; } }
function showError(t){
  msg.textContent = t; msg.className = 'msg err';
  document.body.classList.add('wrong');
  setTimeout(() => document.body.classList.remove('wrong'), 500);
  pin.forEach(b => { b.value=''; b.classList.remove('filled'); });
  pin[0].focus();
  if (navigator.vibrate) try { navigator.vibrate([25,45,25]); } catch(e){}
}

/* ---- prefetch the sealed letter so unlocking feels instant ---- */
let blobPromise = null;
function getBlob(){
  if (!blobPromise){
    blobPromise = fetch(ENC_URL, { cache:'force-cache' })
      .then(r => { if (!r.ok) throw new Error('fetch'); return r.arrayBuffer(); })
      .catch(e => { blobPromise = null; throw e; });
  }
  return blobPromise;
}
getBlob().catch(()=>{});   // warm it up quietly

/* ---- decrypt: PBKDF2-SHA256 -> AES-GCM ---- */
async function unlock(code){
  const buf  = new Uint8Array(await getBlob());
  const salt = buf.slice(0, 16), iv = buf.slice(16, 28), data = buf.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  const key  = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plain);   // throws if the code is wrong
}

function celebrate(){
  const b = $('burst'), g = ['💖','💕','✨','🌸','💗','🤍'];
  for (let i = 0; i < 18; i++){
    const el = document.createElement('i');
    el.textContent = g[i % g.length];
    const a = (Math.PI*2) * (i/18), d = 90 + Math.random()*130;
    el.style.setProperty('--dx', Math.cos(a)*d + 'px');
    el.style.setProperty('--dy', Math.sin(a)*d + 'px');
    el.style.animationDelay = (Math.random()*.12) + 's';
    b.appendChild(el);
  }
}

/* Swap the whole document for the decrypted letter.
   document.write() is not used on purpose: with a payload this large the parser
   never gets around to running the letter's inline script, so the countdown and
   the interactions stay dead. Parsing it and re-creating the script nodes runs
   them deterministically. */
function install(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');

  document.title = doc.title || document.title;
  document.head.querySelectorAll('style, link[rel="stylesheet"]').forEach(n => n.remove());
  Array.from(doc.head.children).forEach(n => {
    if (n.tagName === 'TITLE') return;
    document.head.appendChild(document.importNode(n, true));
  });

  const scripts = Array.from(doc.body.querySelectorAll('script'));
  scripts.forEach(s => s.remove());              // inert copies would never run
  document.body.className = doc.body.className;
  document.body.innerHTML = doc.body.innerHTML;

  scripts.forEach(old => {                       // re-created nodes DO run
    const s = document.createElement('script');
    Array.from(old.attributes).forEach(a => s.setAttribute(a.name, a.value));
    s.textContent = old.textContent;
    document.body.appendChild(s);
  });

  window.scrollTo(0, 0);
}

/* ---- memory game: every right answer earns a hint toward the code ---- */
const QUIZ = [
  { q:'اول شي… متى كان يوم زواجنا؟',
    opts:['٧ اغسطس ٢٠٢٦ — الجمعة','١٧ اغسطس ٢٠٢٦ — الاحد','٧ سبتمبر ٢٠٢٦ — الاثنين'], ans:0,
    love:'صح يا حياتي 💍 من ذاك اليوم وانا احسب نفسي اسعد رجل في الدنيا، وكل يوم يمر احبك اكثر من اللي قبله.',
    hint:'الرمز اربعة ارقام… وانت تعرفينها من دون ما تفكرين.' },

  { q:'وش اسم القاعة اللي تزوجنا فيها؟',
    opts:['قصر اللؤلؤة','قصر الماسة البيضاء','قاعة الاميرات'], ans:1,
    love:'صح 🤍 قصر الماسة البيضاء… والله ما شفت احد في القاعة غيرك، ولا اذكر من الليلة شي غير ابتسامتك.',
    hint:'مو من تاريخ، ولا من عيد ميلاد… شي ثاني تماما.' },

  { q:'وش اسم الفندق اللي نزلنا فيه بعد الزواج؟',
    opts:['Four Seasons','DoubleTree by Hilton','Marriott'], ans:1,
    love:'صح 🏨 اول مكان جمعنا لحالنا… وكانت اجمل ايام، ولا زلت اتذكر ضحكتك فيه.',
    hint:'ولا هو رقم بيت، ولا رقم سيارة.' },

  { q:'اكثر مدينة تحبينها؟',
    opts:['جدة','ابها','المدينة المنورة'], ans:2,
    love:'صح 🕌 المدينة المنورة… احب اني اعرف وش يريح قلبك، وان شاء الله نرجع لها سوا مرات ومرات.',
    hint:'شي تحملينه معك كل يوم وما تنسينه ابدا.' },

  { q:'اول لعبة لعبناها سوا؟',
    opts:['It Takes Two','Overcooked','Split Fiction'], ans:2,

const game=$('game'), playLink=$('playLink');
let qi=0, earned=[];

function showGame(on){
  game.hidden = !on;
  form.hidden = on;
  playLink.hidden = on;
  if (on){ qi=0; earned=[]; renderQ(); }
}
function renderQ(){
  $('gAsk').hidden=false; $('gFeed').hidden=true; $('gDone').hidden=true;
  const item = QUIZ[qi];
  $('gStep').textContent = 'سؤال ' + ar(qi+1) + ' من ' + ar(QUIZ.length);
  $('gBar').style.width = (qi / QUIZ.length * 100) + '%';
  $('gQ').textContent = item.q;
  const box=$('gOpts'); box.innerHTML='';
  item.opts.forEach((text,i) => {
    const b=document.createElement('button');
    b.type='button'; b.className='g-opt'; b.textContent=text;
    b.addEventListener('click', () => answer(i, b));
    box.appendChild(b);
  });
}
function answer(i, btn){
  const item = QUIZ[qi];
  if (i !== item.ans){
    btn.classList.add('wrong'); btn.disabled = true;
    if (navigator.vibrate) try { navigator.vibrate([20,40,20]); } catch(e){}
    return;
  }
  btn.classList.add('right');
  [...$('gOpts').children].forEach(b => b.disabled = true);
  if (navigator.vibrate) try { navigator.vibrate([12,30,12,30,60]); } catch(e){}
  earned.push(item.hint);
  setTimeout(() => {
    $('gAsk').hidden = true; $('gFeed').hidden = false;
    $('gLove').textContent = item.love;
    $('gHint').textContent = item.hint;
    $('gBar').style.width = ((qi+1) / QUIZ.length * 100) + '%';
    $('gNext').textContent = (qi === QUIZ.length-1) ? 'خلصنا 💕' : 'التالي ←';
  }, 520);
}
$('gNext').addEventListener('click', () => {
  qi++;
  if (qi < QUIZ.length) renderQ(); else finishGame();
});
function finishGame(){
  $('gAsk').hidden=true; $('gFeed').hidden=true; $('gDone').hidden=false;
  $('gStep').textContent='';
  const ul=$('gHints'); ul.innerHTML='';
  earned.forEach((h,i) => {
    const li=document.createElement('li');
    li.textContent=h;
    if (i === earned.length-1) li.className='last';
    ul.appendChild(li);
  });
}
playLink.addEventListener('click', () => showGame(true));
$('gClose').addEventListener('click', () => showGame(false));
$('gGo').addEventListener('click', () => { showGame(false); pin[0].focus(); });

/* ---- slide-to-open: the code is right, now she drags the seal across ---- */
const slide = $('slide'), track = $('slideTrack'), knob = $('slideKnob');
let _pendingHtml = null, dragging = false, startX = 0, travel = 0, maxX = 0, opened = false;

function armSlider(html){
  _pendingHtml = html;
  form.hidden = true;                 // the keypad has done its job
  game.hidden = true; playLink.hidden = true;
  slide.hidden = false;
  msg.textContent = 'الرمز صحيح ✨ اسحبي الختم لتفتحيها';
  msg.className = 'msg ok';
  slide.appendChild(msg);             // keep the message under the slider
}
function setProgress(px){
  travel = Math.max(0, Math.min(maxX, px));
  const p = maxX ? travel / maxX : 0;
  knob.style.transform = 'translateX(' + (-travel) + 'px)';
  track.style.setProperty('--p', p.toFixed(3));
  knob.setAttribute('aria-valuenow', Math.round(p * 100));
}
function springBack(){ knob.style.transition = 'transform .3s cubic-bezier(.34,1.4,.64,1)';
  setProgress(0); setTimeout(() => { knob.style.transition = ''; }, 320); }
function completeSlide(){
  if (opened) return; opened = true;
  slide.classList.add('done');
  setProgress(maxX);
  if (navigator.vibrate) try { navigator.vibrate([12,28,12]); } catch(e){}
  reveal(_pendingHtml);
}
knob.addEventListener('pointerdown', e => {
  if (opened) return;
  e.preventDefault();
  dragging = true; startX = e.clientX;
  maxX = track.clientWidth - knob.offsetWidth - 8;
  knob.classList.add('grab');
  try { knob.setPointerCapture(e.pointerId); } catch(err){}
});
knob.addEventListener('pointermove', e => {
  if (!dragging || opened) return;
  setProgress(startX - e.clientX);          // RTL: drag leftwards
  if (travel >= maxX - 2) { dragging = false; completeSlide(); }
});
function endDrag(){
  if (!dragging || opened) return;
  dragging = false; knob.classList.remove('grab');
  if (travel >= maxX - 2) completeSlide(); else springBack();
}
knob.addEventListener('pointerup', endDrag);
knob.addEventListener('pointercancel', endDrag);
// keyboard: Enter/Space opens it too
knob.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){ e.preventDefault();
    maxX = track.clientWidth - knob.offsetWidth - 8; completeSlide(); }
});

function reveal(html){
  document.body.classList.add('opened');
  msg.textContent = 'أهلا بك يا سُهى 💕'; msg.className = 'msg ok';
  celebrate();
  if (navigator.vibrate) try { navigator.vibrate([15,40,15,40,60]); } catch(e){}
  setTimeout(() => install(html), 1150);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const code = pin.map(b => b.value).join('');
  if (code.length < 4){ showError('اكتبي الأرقام الأربعة أولا 🌷'); return; }
  document.body.classList.add('loading'); go.disabled = true;
  msg.textContent = 'لحظة… أفتح لك الرسالة'; msg.className = 'msg';
  try {
    const html = await unlock(code);
    try { sessionStorage.setItem(KEEP, code); } catch(err){}
    document.body.classList.remove('loading');
    armSlider(html);          // right code — now the slide-to-open gesture
  } catch (err) {
    document.body.classList.remove('loading'); go.disabled = false;
    showError(err && err.message === 'fetch'
      ? 'تعذر تحميل الرسالة — تأكدي من الإنترنت 🥺'
      : 'الرمز غير صحيح… حاولي مرة ثانية 🥺');
  }
});

/* ---- already unlocked this session? open straight away ---- */
(async function resume(){
  let saved = null;
  try { saved = sessionStorage.getItem(KEEP); } catch(e){}
  if (!saved) return;
  try {
    const html = await unlock(saved);
    install(html);
  } catch(e){ try { sessionStorage.removeItem(KEEP); } catch(err){} }
})();
</script>
