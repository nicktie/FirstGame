<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>رسالة لكِ 💌</title>
<meta name="theme-color" content="#F6E4EE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#4A2545; --ink-soft:rgba(74,37,69,.66);
    --gold:#D68FB0; --gold-soft:#F0C9DE;
    --ivory:#FDF4F8; --ivory-2:#F6E4EE;
    --wine:#9C3F72; --sage:#B79FDB;
    --line:rgba(74,37,69,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Tajawal',sans-serif; color:var(--ink);
    background:
      radial-gradient(120% 80% at 50% 0%, #FBE6F1 0%, #F3DCEC 40%, #EBD7F0 100%);
    display:flex; align-items:center; justify-content:center;
    padding:22px; overflow:hidden; position:relative;
  }

  /* floating hearts */
  .hearts{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0}
  .hearts span{
    position:absolute; bottom:-40px; font-size:16px; opacity:0;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) scale(.7) rotate(0deg); opacity:0}
    12%{opacity:.75}
    100%{transform:translateY(-108vh) scale(1.05) rotate(22deg); opacity:0}
  }
  @media (prefers-reduced-motion:reduce){ .hearts{display:none} }

  /* card */
  .card{
    position:relative; z-index:1; width:100%; max-width:380px;
    background:rgba(255,255,255,.86);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.9);
    border-radius:28px; padding:34px 26px 28px;
    text-align:center;
    box-shadow:0 24px 60px rgba(74,37,69,.16), 0 2px 0 rgba(255,255,255,.9) inset;
    animation:pop .6s cubic-bezier(.34,1.4,.64,1);
  }
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}

  /* envelope */
  .env{
    width:96px; height:70px; margin:0 auto 20px; position:relative;
    filter:drop-shadow(0 10px 18px rgba(156,63,114,.22));
  }
  .env .body{
    position:absolute; inset:0; border-radius:10px;
    background:linear-gradient(160deg,#FFF6FA,#F7DCEA);
    border:1.5px solid var(--gold-soft);
  }
  .env .flap{
    position:absolute; left:0; right:0; top:0; height:44px;
    background:linear-gradient(160deg,#F9E3EE,#EFC9DC);
    border:1.5px solid var(--gold-soft);
    border-radius:10px 10px 46% 46%;
    transform-origin:top center; transition:transform .7s cubic-bezier(.5,-0.2,.3,1.3);
  }
  .env .seal{
    position:absolute; left:50%; top:52%; transform:translate(-50%,-50%);
    width:30px; height:30px; border-radius:50%;
    background:radial-gradient(circle at 35% 32%, #E9A4C2, var(--wine));
    color:#fff; font-size:14px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 8px rgba(156,63,114,.4); z-index:2;
    transition:transform .5s ease, opacity .5s ease;
  }
  body.opened .env .flap{transform:rotateX(-172deg)}
  body.opened .env .seal{transform:translate(-50%,-50%) scale(.2) rotate(160deg); opacity:0}

  h1{font-family:'Amiri',serif; font-size:25px; font-weight:700; margin-bottom:7px; line-height:1.35}
  h1 em{font-style:normal; color:var(--wine)}
  .sub{font-size:13.5px; color:var(--ink-soft); line-height:1.85; margin-bottom:22px}

  /* pin */
  .pin{display:flex; gap:10px; justify-content:center; direction:ltr; margin-bottom:8px}
  .pin input{
    width:54px; height:62px; text-align:center;
    font-family:'Amiri',serif; font-size:26px; font-weight:700; color:var(--wine);
    background:#fff; border:1.6px solid var(--gold-soft); border-radius:16px;
    outline:none; transition:.2s; box-shadow:0 3px 10px rgba(74,37,69,.06);
    -moz-appearance:textfield;
  }
  .pin input::-webkit-outer-spin-button,.pin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .pin input:focus{
    border-color:var(--gold); transform:translateY(-2px);
    box-shadow:0 8px 18px rgba(214,143,176,.34), 0 0 0 4px rgba(240,201,222,.5);
  }
  .pin input.filled{background:#FFF8FC; border-color:var(--gold)}
  body.wrong .pin{animation:shake .45s}
  @keyframes shake{
    0%,100%{transform:translateX(0)} 20%{transform:translateX(-9px)}
    40%{transform:translateX(9px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
  }
  body.wrong .pin input{border-color:#E2799C}

  .msg{min-height:22px; font-size:12.5px; color:var(--ink-soft); margin:6px 0 16px; transition:.2s}
  .msg.err{color:#C2456F; font-weight:700}
  .msg.ok{color:#3E9E7A; font-weight:700}

  button.go{
    width:100%; padding:14px; border:none; border-radius:16px; cursor:pointer;
    font-family:'Tajawal',sans-serif; font-size:15.5px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,#E39CBC,var(--wine));
    box-shadow:0 10px 24px rgba(156,63,114,.3);
    transition:transform .15s, box-shadow .2s, opacity .2s;
  }
  button.go:hover{transform:translateY(-2px); box-shadow:0 14px 30px rgba(156,63,114,.36)}
  button.go:active{transform:translateY(0)}
  button.go:disabled{opacity:.6; cursor:default; transform:none}

  .foot{margin-top:16px; font-family:'Aref Ruqaa',serif; font-size:15px; color:var(--gold)}

  /* loading */
  .spin{
    display:none; width:18px; height:18px; margin:0 auto;
    border:2.5px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  body.loading .spin{display:block}
  body.loading .go-text{display:none}

  /* success burst */
  .burst{position:fixed; inset:0; pointer-events:none; z-index:5; display:none}
  body.opened .burst{display:block}
  .burst i{
    position:absolute; left:50%; top:50%; font-size:20px; font-style:normal;
    animation:burst .9s ease-out forwards;
  }
  @keyframes burst{
    from{transform:translate(-50%,-50%) scale(.4); opacity:1}
    to{transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity:0}
  }
  @media(max-width:360px){ .pin input{width:48px;height:56px;font-size:23px} }
</style>
</head>
<body>

<div class="hearts" id="hearts" aria-hidden="true"></div>
<div class="burst" id="burst" aria-hidden="true"></div>

<main class="card">
  <div class="env" aria-hidden="true">
    <div class="body"></div>
    <div class="flap"></div>
    <div class="seal">♥</div>
  </div>

  <h1>رسالة <em>لكِ</em> وحدكِ 💌</h1>
  <p class="sub">في الداخل رحلتنا الأولى معًا…<br>اكتبي الرمز السرّي لتفتحيها</p>

  <form id="form" autocomplete="off">
    <div class="pin" id="pin">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم الأول">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم الثاني">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم الثالث">
      <input type="tel" inputmode="numeric" maxlength="1" aria-label="الرقم الرابع">
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <button class="go" id="go" type="submit">
      <span class="go-text">افتحي الرسالة 💖</span>
      <span class="spin"></span>
    </button>
  </form>

  <div class="foot">أسامة ♥ سُهى</div>
</main>

<script>
'use strict';
const ITER = 300000, ENC_URL = 'journey.enc', KEEP = 'hm_open';

const $ = id => document.getElementById(id);
const pin = [...$('pin').querySelectorAll('input')];
const msg = $('msg'), go = $('go'), form = $('form');

/* ---- floating hearts ---- */
(function(){
  const wrap = $('hearts'), glyphs = ['💗','💖','🤍','💕','🌸','✨'];
  for (let i = 0; i < 16; i++){
    const s = document.createElement('span');
    s.textContent = glyphs[i % glyphs.length];
    s.style.left = Math.random()*100 + '%';
    s.style.fontSize = (12 + Math.random()*14) + 'px';
    s.style.animationDuration = (9 + Math.random()*9) + 's';
    s.style.animationDelay = (Math.random()*10) + 's';
    wrap.appendChild(s);
  }
})();

/* ---- pin box behaviour: auto-advance, backspace, paste ---- */
pin.forEach((box, i) => {
  box.addEventListener('input', () => {
    box.value = box.value.replace(/\D/g,'').slice(0,1);
    box.classList.toggle('filled', !!box.value);
    clearError();
    if (box.value && i < pin.length-1) pin[i+1].focus();
    if (pin.every(b => b.value)) form.requestSubmit();
  });
  box.addEventListener('keydown', e => {
    if (e.key === 'Backspace' && !box.value && i > 0){ pin[i-1].focus(); pin[i-1].value=''; pin[i-1].classList.remove('filled'); }
    if (e.key === 'ArrowLeft'  && i > 0) pin[i-1].focus();
    if (e.key === 'ArrowRight' && i < pin.length-1) pin[i+1].focus();
  });
  box.addEventListener('paste', e => {
    const d = (e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,4);
    if (!d) return;
    e.preventDefault();
    d.split('').forEach((ch,k) => { if (pin[k]){ pin[k].value=ch; pin[k].classList.add('filled'); } });
    (pin[d.length] || pin[3]).focus();
    if (pin.every(b => b.value)) form.requestSubmit();
  });
});
setTimeout(() => pin[0].focus(), 400);

function clearError(){ document.body.classList.remove('wrong'); if (msg.classList.contains('err')){ msg.textContent=''; msg.className='msg'; } }
function showError(t){
  msg.textContent = t; msg.className = 'msg err';
  document.body.classList.add('wrong');
  setTimeout(() => document.body.classList.remove('wrong'), 500);
  pin.forEach(b => { b.value=''; b.classList.remove('filled'); });
  pin[0].focus();
  if (navigator.vibrate) try { navigator.vibrate([25,45,25]); } catch(e){}
}

/* ---- prefetch the sealed letter so unlocking feels instant ---- */
let blobPromise = null;
function getBlob(){
  if (!blobPromise){
    blobPromise = fetch(ENC_URL, { cache:'force-cache' })
      .then(r => { if (!r.ok) throw new Error('fetch'); return r.arrayBuffer(); })
      .catch(e => { blobPromise = null; throw e; });
  }
  return blobPromise;
}
getBlob().catch(()=>{});   // warm it up quietly

/* ---- decrypt: PBKDF2-SHA256 -> AES-GCM ---- */
async function unlock(code){
  const buf  = new Uint8Array(await getBlob());
  const salt = buf.slice(0, 16), iv = buf.slice(16, 28), data = buf.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  const key  = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(plain);   // throws if the code is wrong
}

function celebrate(){
  const b = $('burst'), g = ['💖','💕','✨','🌸','💗','🤍'];
  for (let i = 0; i < 18; i++){
    const el = document.createElement('i');
    el.textContent = g[i % g.length];
    const a = (Math.PI*2) * (i/18), d = 90 + Math.random()*130;
    el.style.setProperty('--dx', Math.cos(a)*d + 'px');
    el.style.setProperty('--dy', Math.sin(a)*d + 'px');
    el.style.animationDelay = (Math.random()*.12) + 's';
    b.appendChild(el);
  }
}

/* Swap the whole document for the decrypted letter.
   document.write() is not used on purpose: with a payload this large the parser
   never gets around to running the letter's inline script, so the countdown and
   the interactions stay dead. Parsing it and re-creating the script nodes runs
   them deterministically. */
function install(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');

  document.title = doc.title || document.title;
  document.head.querySelectorAll('style, link[rel="stylesheet"]').forEach(n => n.remove());
  Array.from(doc.head.children).forEach(n => {
    if (n.tagName === 'TITLE') return;
    document.head.appendChild(document.importNode(n, true));
  });

  const scripts = Array.from(doc.body.querySelectorAll('script'));
  scripts.forEach(s => s.remove());              // inert copies would never run
  document.body.className = doc.body.className;
  document.body.innerHTML = doc.body.innerHTML;

  scripts.forEach(old => {                       // re-created nodes DO run
    const s = document.createElement('script');
    Array.from(old.attributes).forEach(a => s.setAttribute(a.name, a.value));
    s.textContent = old.textContent;
    document.body.appendChild(s);
  });

  window.scrollTo(0, 0);
}

function reveal(html){
  document.body.classList.add('opened');
  msg.textContent = 'أهلاً بكِ يا سُهى 💕'; msg.className = 'msg ok';
  celebrate();
  if (navigator.vibrate) try { navigator.vibrate([15,40,15,40,60]); } catch(e){}
  setTimeout(() => install(html), 1150);
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const code = pin.map(b => b.value).join('');
  if (code.length < 4){ showError('اكتبي الأرقام الأربعة أولاً 🌷'); return; }
  document.body.classList.add('loading'); go.disabled = true;
  msg.textContent = 'لحظة… أفتح لكِ الرسالة'; msg.className = 'msg';
  try {
    const html = await unlock(code);
    try { sessionStorage.setItem(KEEP, code); } catch(err){}
    reveal(html);
  } catch (err) {
    document.body.classList.remove('loading'); go.disabled = false;
    showError(err && err.message === 'fetch'
      ? 'تعذّر تحميل الرسالة — تأكّدي من الإنترنت 🥺'
      : 'الرمز غير صحيح… حاولي مرّة ثانية 🥺');
  }
});

/* ---- already unlocked this session? open straight away ---- */
(async function resume(){
  let saved = null;
  try { saved = sessionStorage.getItem(KEEP); } catch(e){}
  if (!saved) return;
  try {
    const html = await unlock(saved);
    install(html);
  } catch(e){ try { sessionStorage.removeItem(KEEP); } catch(err){} }
})();
</script>
</body>
</html>
